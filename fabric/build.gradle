plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation("dev.ftb.mods:ftb-library-fabric:${rootProject.ftb_library_version}") { transitive false }
    modImplementation("dev.ftb.mods:ftb-teams-fabric:${rootProject.ftb_teams_version}") { transitive false }
    modImplementation("dev.ftb.mods:ftb-quests-fabric:${rootProject.ftb_quests_version}") { transitive false }
    modCompileOnly("net.puffish:skillsmod:${puffish_skills}:fabric")
    modCompileOnly "curse.maven:blabber-565396:6445342"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:6.1.2"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:6.1.2"

    modCompileOnly("maven.modrinth:spell-engine:1.9.2+1.21.1-fabric")

    modCompileOnly "curse.maven:levelz-517130:6181516"

    modCompileOnly("dev.muon.dynamic_difficulty:dynamic_difficulty-fabric:${dynamic_difficulty_version}")
    modCompileOnly "curse.maven:dungeon-difficulty-645559:7310940"

    modCompileOnly("curse.maven:origins-391943:6112839") {
        transitive = false
    }
    modCompileOnly files("libs/Calio-1.14.0-alpha.9+mc.1.21.x.jar")

    modCompileOnly "curse.maven:easy-npc-core-1308987:7619174"
    modCompileOnly "curse.maven:easy-npc-config-ui-1214728:7618692"
    modCompileOnly "curse.maven:accessories-938917:7583323"
    modCompileOnly "curse.maven:mob-journal-1240246:8589051"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publishMods {
    // The per-task dryRun is wired from this and finalized in the task constructor, so it
    // has to be set here. Keyed off the requested task names so publishModsDry rehearses
    // while a plain publishMods still uploads for real.
    dryRun = gradle.startParameter.taskNames.any { it.contains("publishModsDry") }

    file = tasks.remapJar.archiveFile
    displayName = "More Quest Types [FABRIC] [${rootProject.minecraft_version}] - [${project.version}]"
    type = STABLE
    modLoaders.add("fabric")

    def changelogFile = rootProject.file("CHANGELOG.md")
    def changelogText = changelogFile.exists() ? changelogFile.text : ""
    changelog = changelogText.trim().isEmpty() ? "No changelog provided." : changelogText

    curseforge {
        projectId = "1361832"
        projectSlug = "more-quest-types"
        accessToken = providers.gradleProperty("cfToken")
            .orElse(providers.environmentVariable("CF_TOKEN"))
        minecraftVersions.add("1.21.1")
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
    }

    modrinth {
        projectId = "jE4d4DOP"
        accessToken = providers.gradleProperty("modrinthToken")
            .orElse(providers.environmentVariable("MODRINTH_TOKEN"))
        minecraftVersions.add("1.21.1")
    }
}

// Offline rehearsal: validates the config, writes the jar out and logs the display name,
// version and changelog — without contacting either platform. Replaces the old plugin's
// publishUnifiedToLocal.
//
// The plugin hardcodes its own build/publishMods/<task>/ output and finalizes that path in
// the task constructor, so it cannot be redirected. The jars are collected into
// build/unified-dry/ afterwards instead, giving one predictable place to look regardless
// of how many platforms are configured.
tasks.register("publishModsDry", Copy) {
    group = "upload"
    description = "Dry run of publishMods — writes to build/unified-dry/ instead of uploading."

    def publishTasks = tasks.withType(me.modmuss50.mpp.PublishModTask)
    dependsOn publishTasks

    from(publishTasks.collect { it.dryRunDirectory }) {
        include "**/*.jar"
    }
    into rootProject.layout.buildDirectory.dir("unified-dry")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Gradle's built-in "publishing" group also holds the Maven publication tasks, which do
// not upload anywhere. Moving all four mod-publishing tasks into their own group keeps
// the two kinds of "publish" apart in the IDE's task tree.
tasks.named("publishMods") { group = "upload" }
tasks.withType(me.modmuss50.mpp.PublishModTask).configureEach {
    group = "upload"
}
